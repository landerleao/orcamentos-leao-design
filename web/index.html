<style>
:root{--bg:#0c0c0c;--panel:#171717;--panel2:#1f1f1f;--line:#2a2a2a;--ink:#F9F9F9;--mute:#8d8d8d;--accent:#FF0048;--light:#F9F9F9;--dark:#131313;--r:22px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:14px/1.45 'PoppinsEmb',Poppins,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);min-height:100vh;
  background:var(--bg) radial-gradient(900px 420px at 85% -120px,color-mix(in srgb,var(--accent) 16%,transparent),transparent) no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:17px;height:17px;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:9px 16px;font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#444}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.accent:hover{filter:brightness(1.1)}
.btn.light{background:var(--light);color:var(--dark);border-color:var(--light);font-weight:500}
.btn.icon{width:40px;height:40px;padding:0;justify-content:center}
.btn.danger{color:#ff6b7f}
.btn.sm{padding:6px 12px;font-size:12px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#101010;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical}
select option{background:#1a1a1a}
label{display:block;font-size:12px;color:var(--mute)}
label>input,label>select,label>textarea,label>.color-row{margin-top:5px;font-size:14px}
input[type=color]{padding:3px;height:42px;width:50px;flex:none;border-radius:12px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.sp{flex:1}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.full{grid-column:1/-1}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0}
.lbl{font-size:12px;color:var(--mute)}

/* topo */
.top{display:flex;align-items:center;gap:14px;padding:18px 28px;max-width:1480px;margin:0 auto}
.top .logo img{height:28px;display:block}
.top .logo b{font-size:18px}
.pillnav{display:flex;gap:2px;background:var(--light);border-radius:99px;padding:4px;margin-left:18px}
.pillnav button{border:0;background:transparent;color:#555;border-radius:99px;padding:8px 18px;font-size:13px;cursor:pointer}
.pillnav button:hover{color:var(--dark)}
.pillnav button.on{background:var(--accent);color:#fff;font-weight:500}
main{padding:6px 28px 70px;max-width:1480px;margin:0 auto}
.phead{display:flex;align-items:center;gap:14px;margin:12px 0 22px}
.phead h1{font-size:40px;font-weight:500;margin:0;letter-spacing:-.01em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}

/* painel de números */
.hero{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.stat .lbl{display:block;margin-bottom:6px}
.stat b{font-size:27px;font-weight:500;letter-spacing:-.01em;display:block;white-space:nowrap}
.stat b small{font-size:14px;color:var(--mute);font-weight:400;margin-left:4px}
.stat .sub{font-size:12px;color:var(--mute);margin-top:2px}
.bar{height:8px;border-radius:9px;background:#2a2a2a;margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 75%,#000) 6px 9px)}
.month{border-radius:var(--r);padding:22px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(280px 200px at 100% 0,color-mix(in srgb,var(--accent) 90%,#fff),transparent),linear-gradient(140deg,color-mix(in srgb,var(--accent) 55%,#000),var(--accent))}
.month .lbl{color:#ffffffc0}
.month b{font-size:30px;font-weight:500;display:block;margin:4px 0 2px}
.month .btn{position:absolute;right:18px;bottom:18px}

/* filtros */
.filters{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters .ttl{font-size:15px;margin-right:8px}
.fpill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 8px 7px 15px;font-size:13px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--ink)}
.fpill span{background:#2c2c2c;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:11px;padding:0 6px}
.fpill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fpill.on span{background:#0003}
.search{position:relative;margin-left:auto;width:300px}
.search input{border-radius:99px;padding-left:40px;background:var(--panel)}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}

/* quadro claro com lista + detalhe */
.board{background:var(--light);color:var(--dark);border-radius:28px;padding:18px;display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:18px;min-height:420px}
.board h3{margin:8px 10px 12px;font-size:15px;font-weight:500}
.qrow{display:grid;grid-template-columns:42px 1fr auto auto;gap:12px;align-items:center;padding:9px 12px;border-radius:99px;cursor:pointer;margin-bottom:2px}
.qrow:hover{background:#ececec}
.qrow.on{background:var(--dark);color:var(--light)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:color-mix(in srgb,var(--accent) 14%,#fff);color:var(--accent)}
.qrow.on .av{background:var(--accent);color:#fff}
.qrow .num{font-weight:600;font-size:13px}
.qrow .cli{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.qrow .val{font-weight:500;font-size:15px;text-align:right;min-width:100px}
.chip{display:inline-block;font-size:11px;padding:4px 11px;border-radius:99px;background:#7771;border:1px solid #7773;white-space:nowrap}
.qrow.on .chip{background:#fff;color:var(--dark);border-color:#fff}
.chip.enviado{background:#3b82f61a;border-color:#3b82f640;color:#3b82f6}
.chip.aprovado{background:#22c55e1a;border-color:#22c55e40;color:#16a34a}
.chip.recusado{background:#ef44441a;border-color:#ef444440;color:#ef4444}
.detail{background:var(--dark);color:var(--light);border-radius:24px;padding:24px;display:flex;flex-direction:column}
.detail .dh{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px;margin-bottom:20px}
.detail .big{font-size:32px;font-weight:500;display:flex;align-items:center;gap:12px;margin-top:2px}
.detail .big small{color:var(--mute);font-size:20px;margin-right:-6px}
.detail .who{font-weight:500;margin-top:4px}
.detail .who small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;align-content:start}
.mini{background:#1d1d1d;border:1px solid #2a2a2a;border-radius:16px;padding:14px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.mini b{font-size:17px;font-weight:500}
.mini span{font-size:12px;color:#a5a5a5}
.mini.more{align-items:center;justify-content:center;color:var(--mute);background:repeating-linear-gradient(-45deg,#1b1b1b 0 8px,#202020 8px 16px)}
.tbar{display:flex;align-items:center;gap:26px;background:#222;border-radius:99px;padding:12px 14px 12px 24px;margin-top:16px}
.tbar .lbl{display:block;font-size:11px}
.tbar b{font-size:19px;font-weight:500}
.tbar b.ac{color:var(--accent)}
.empty{text-align:center;padding:70px 20px;color:#888;grid-column:1/-1}

/* editor */
.editor{display:grid;grid-template-columns:minmax(400px,540px) 1fr;gap:20px;align-items:start}
.editor>*,.brandgrid>*{min-width:0}
.form .card{margin-bottom:14px}
.item{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--panel2)}
.item-top{display:flex;gap:6px}
.item-top input{font-weight:500}
.item-top .btn.icon{width:38px;height:38px}
.item textarea{margin-top:8px;font-size:13px}
.item-nums{display:grid;grid-template-columns:80px 96px 1fr auto;gap:8px;margin-top:8px;align-items:end}
.item-total{font-weight:500;padding-bottom:10px;white-space:nowrap;color:var(--accent)}
.preview{position:sticky;top:16px}
.pv-wrap{overflow:hidden;border-radius:16px;box-shadow:0 20px 60px #000a;border:1px solid var(--line)}
.pv-scale{transform-origin:0 0;width:794px}

/* catálogo */
.cat-h{font-size:15px;font-weight:500;color:var(--accent);margin:24px 0 10px}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.svc{padding:18px}
.svc-top{display:flex;gap:8px}
.svc-name{font-weight:500;font-size:15px}
.vars{display:grid;gap:6px;margin-top:10px}
.vars:empty{display:none}
.var{display:grid;grid-template-columns:1fr 130px 40px;gap:6px}
.var .btn.icon{width:40px;height:42px}
input:disabled{opacity:.45}
.warn{color:#ffb020}

/* marca */
.brandgrid{display:grid;grid-template-columns:minmax(400px,580px) 1fr;gap:20px;align-items:start}
.brandgrid .card{margin-bottom:14px}
.logo-box{display:flex;gap:14px;align-items:center}
.logo-box .lg{width:170px;height:80px;border:1px dashed #3a3a3a;border-radius:14px;display:grid;place-items:center;padding:10px;overflow:hidden;color:var(--mute);font-size:12px;flex:none}
.logo-box img{max-width:100%;max-height:100%}
.color-row{display:flex;gap:6px}
.check{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:14px;margin-top:14px}

/* bloqueio */
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
#login .card{width:min(360px,100%);text-align:center;padding:34px;display:grid;gap:10px}
#login img{height:30px;margin:0 auto 12px}
#login .btn{width:100%;justify-content:center;margin-top:4px}
.sync{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none}
.sync.saving::before{background:#ffb020}
.sync.offline::before{background:#ef4444}
.demo-bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;
  background:var(--accent);color:#fff;border-radius:99px;padding:7px 8px 7px 18px;font-size:13px;white-space:nowrap;box-shadow:0 10px 30px #0008}
.sheet{position:fixed;inset:0;background:#000b;display:grid;place-items:end center;z-index:70;padding:20px 16px max(20px,env(safe-area-inset-bottom))}
.sheet .card{width:min(420px,100%);text-align:center;display:grid;gap:10px}
.sheet .btn{justify-content:center;padding:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--light);color:var(--dark);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

@media (max-width:700px){
  input,select,textarea{font-size:16px}
  .top{flex-wrap:wrap;padding:max(12px,env(safe-area-inset-top)) 14px 10px;gap:10px}
  .top .logo img{height:22px}
  .pillnav{order:3;width:100%;margin:0}
  .pillnav button{flex:1;padding:9px 4px}
  #newBtn .nt,.sync{font-size:0;gap:0}
  #newBtn{width:40px;height:40px;padding:0;justify-content:center}
  main{padding:4px 14px 90px}
  .phead{flex-wrap:wrap;margin:8px 0 16px;gap:8px}
  .phead h1{font-size:28px}
  .card{padding:16px;border-radius:18px}
  .stats{grid-template-columns:1fr 1fr;gap:18px}
  .stat b{font-size:19px}
  .bar{margin-top:10px}
  .filters{gap:6px}
  .filters .ttl{display:none}
  .search{order:-1;width:100%}
  .fpill{padding:6px 6px 6px 12px;font-size:12px}
  .board{padding:10px;border-radius:22px;gap:12px}
  .qrow{grid-template-columns:36px 1fr auto;padding:8px 10px}
  .qrow .chip{display:none}
  .av{width:36px;height:36px}
  .detail{padding:18px;border-radius:20px}
  .detail .dh{grid-template-columns:1fr 1fr;gap:14px}
  .detail .dh>div:first-child{grid-column:1/-1}
  .detail .big{font-size:26px}
  .minis{grid-template-columns:1fr 1fr}
  .mini{min-height:80px;padding:12px}
  .tbar{flex-wrap:wrap;border-radius:20px;gap:14px;padding:14px}
  .tbar .sp{display:none}
  .tbar .btn.accent{flex:1;justify-content:center}
  .g3{grid-template-columns:1fr 1fr}
  .item-nums{grid-template-columns:1fr 1fr 1.3fr}
  .item-total{grid-column:1/-1;padding:0;text-align:right}
  .svcs{grid-template-columns:1fr}
  .var{grid-template-columns:1fr 110px 40px}
  .logo-box{flex-wrap:wrap}
}
@media (max-width:1100px){.hero,.board,.editor,.brandgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.preview{position:static}.search{width:100%;margin-left:0}.pillnav{margin-left:0}}

/* ===== documento (PDF) ===== */
.pages{display:grid;gap:16px}
.blk{display:flow-root}
.doc{width:794px;height:1123px;background:var(--bg);color:var(--fg);font-size:12.5px;line-height:1.55;position:relative;overflow:hidden;
  --mute:color-mix(in srgb,var(--fg) 48%,var(--bg));--soft:color-mix(in srgb,var(--fg) 74%,var(--bg));--ln:color-mix(in srgb,var(--fg) 15%,var(--bg))}
.d-wave{display:block;width:100%;height:200px}
.d-body.cont{margin-top:0;padding-top:52px}
.d-top.cont{margin-bottom:30px;padding-bottom:14px;border-bottom:1px solid var(--ln)}
.d-top.cont .d-logo img{height:26px}
.d-top.cont .d-num{font-weight:500;font-size:12px;color:var(--mute)}
.d-pn{position:absolute;right:64px;bottom:26px;font-size:10px;color:var(--mute);letter-spacing:.08em}
.d-body{padding:0 64px 50px;margin-top:-30px;position:relative}
.d-top{display:flex;justify-content:space-between;align-items:center}
.d-logo img{height:34px;display:block}
.d-logo strong{font-size:20px}
.d-num{font-weight:600;font-size:14px;letter-spacing:.04em}
.d-big{font-size:70px;font-weight:600;line-height:1;margin:20px 0 30px;letter-spacing:-.01em;text-transform:uppercase}
.d-lbl{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;font-weight:500}
.d-meta{display:grid;grid-template-columns:1fr 1.35fr .6fr;gap:24px;margin-bottom:32px}
.d-meta strong{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.d-meta div div{color:var(--soft)}
.d-meta .r{text-align:right}
.d-meta .r .d-lbl+div{font-size:15px;color:var(--fg);margin-bottom:12px}
.d-proj{margin:-12px 0 22px;font-size:17px;font-weight:500}
.d-items{width:100%;border-collapse:collapse}
.d-items th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;text-align:left;color:var(--mute);font-weight:500;padding:0 0 10px;border-bottom:1px solid var(--ln)}
.d-items td{padding:13px 0;border-bottom:1px solid var(--ln);vertical-align:top}
.d-items .n{text-align:right;white-space:nowrap;padding-left:22px}
.d-items td.n.m{color:var(--mute)}
.d-items .nm{font-size:14px;font-weight:500}
.d-items .desc{color:var(--mute);font-size:11.5px;white-space:pre-line;margin-top:2px}
.d-items .none td{color:var(--mute);text-align:center;padding:30px}
.d-totals{margin:16px 0 0 auto;width:260px}
.d-totals div{display:flex;justify-content:space-between;padding:4px 0;color:var(--soft)}
.d-totals .grand{border-top:1px solid var(--ln);margin-top:8px;padding-top:13px;font-weight:600;font-size:15px;color:var(--fg)}
.d-totals .grand span:last-child{color:var(--a)}
.d-info{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
.d-info p,.d-notes p{margin:0;color:var(--soft);white-space:pre-line}
.d-notes{margin-top:16px}
.d-sign{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.d-sign div{border-top:1px solid var(--ln);padding-top:7px;font-size:11px;color:var(--mute);text-align:center}

#print{display:none}
@media print{
  html,body{background:var(--printbg,#fff)}
  .app,#login,.toast,.sheet,.demo-bar{display:none!important}
  #print{display:block}
  #print .pages{display:block}
  #print .doc{width:210mm;height:296.6mm;break-after:page;page-break-after:always}
  #print .doc:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

</div>

function num(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[^\d.,-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + (+n || 0)); return fmtDate(d.toISOString().slice(0, 10)); };

function hash(s) { // hash simples para o PIN (não guarda o PIN em texto)
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function mix(a, b, t) { // mistura duas cores hex
  const p = h => (h = h.replace('#', ''), [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) || 0));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

async function push() {
  if (!user || demo) return;
  if (pushing) { pushAgain = true; return; }

  let disc = q.discountType === 'pct' ? sub * num(q.discount) / 100 : num(q.discount);

  return {sub, disc, total: sub - disc};
}

const waveCache = {};
function waveImg(bg, a) {
  const key = bg + a;
  if (!waveCache[key]) {
    const W = 1588, H = 400, cv = document.createElement('canvas'), x = cv.getContext('2d');
    cv.width = W; cv.height = H;
    const lin = (stops, x1 = W, y1 = 0) => { const g = x.createLinearGradient(0, 0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
    x.fillStyle = lin([[0, mix(a, bg, .82)], [.28, mix(a, '#3a0016', .55)], [.5, mix(a, bg, .55)], [.66, a], [.82, mix(a, '#ffffff', .35)], [1, mix(a, bg, .2)]]);
    x.fillRect(0, 0, W, H);
    x.save(); x.translate(W * .7, H * .38); x.scale(1, .62);
    const r = x.createRadialGradient(0, 0, 0, 0, 0, W * .43); r.addColorStop(0, mix(a, '#ffffff', .25) + '8c'); r.addColorStop(1, a + '00');
    x.fillStyle = r; x.fillRect(-W, -H * 2, W * 2, H * 4); x.restore();
    x.fillStyle = lin([[.45, bg + '00'], [1, bg]], 0, H); x.fillRect(0, 0, W, H);
    const sx = W / 794, sy = H / 250, curve = () => { x.moveTo(-40 * sx, 205 * sy); x.bezierCurveTo(150 * sx, 200 * sy, 250 * sx, 96 * sy, 400 * sx, 74 * sy); x.bezierCurveTo(540 * sx, 54 * sy, 640 * sx, 140 * sy, 834 * sx, 182 * sy); };
    x.beginPath(); curve(); x.lineTo(834 * sx, H + 2); x.lineTo(-40 * sx, H + 2); x.closePath(); x.fillStyle = bg; x.fill();
    x.beginPath(); curve(); x.lineWidth = 4;
    x.strokeStyle = lin([[0, a + '00'], [.35, mix(a, '#ffffff', .5) + '8c'], [.55, '#ffffffe6'], [.75, mix(a, '#ffffff', .4) + 'cc'], [1, a + '33']]); x.stroke();
    waveCache[key] = cv.toDataURL('image/png');
  }

}

function catalogOptions() {
  const groups = {};
  state.catalog.forEach(c => (groups[c.cat || 'Outros'] ??= []).push(c));
  const opt = (c, vi) => {
    const v = vi === '' ? null : c.vars[vi];
    const price = v ? v.price : c.price;
    const tail = price ? ' · ' + brl(price) + (v ? '' : '/' + esc(c.unit)) : c.consult ? ' · sob consulta' : '';
    return `<option value="${c.id}|${vi}">${esc(c.name)}${v ? ' — ' + esc(v.label) : ''}${tail}</option>`;
  };
  return Object.entries(groups).map(([g, items]) => `<optgroup label="${esc(g)}">${items.map(c => c.vars?.length ? c.vars.map((_, k) => opt(c, k)).join('') : opt(c, '')).join('')}</optgroup>`).join('');
}
// item de orçamento a partir de um serviço do catálogo (e da variação escolhida)
function itemFrom(c, vi) {
  const v = vi == null ? null : c.vars[vi];
  return {name: v ? `${c.name} (${v.label})` : c.name, desc: c.desc, qty: 1, unit: c.unit, price: v ? v.price : c.price, cid: c.id, vi};
}

// ---------- eventos ----------
function pickFile(accept, cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept;
  inp.onchange = () => { const file = inp.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => cb(r.result, file); file.type.includes('json') || file.name.endsWith('.json') ? r.readAsText(file) : r.readAsDataURL(file); };
  inp.click();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-sel]'); if (!t) return;
  const d = t.dataset;
  if (d.view) return go(d.view);
  if (t.id === 'newBtn' || 'new' in d) return go('edit', newQuote().id);
  if (d.filter) { filter = d.filter; return renderList(); }
  if (d.sel) { selId = d.sel; renderList(); if (matchMedia('(max-width:700px)').matches) $('.detail')?.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  if (d.edit) return go('edit', d.edit);
  if (d.pdf) return printQuote(findQ(d.pdf));
  if (d.dup) { const n = newQuote(findQ(d.dup)); toast(`Duplicado como ${n.number}`); return go('edit', n.id); }
  if ('catAdd' in d) { state.catalog.push({id: uid(), cat: 'Outros', name: '', desc: '', unit: 'un', price: 0, consult: false, vars: []}); save(); renderCatalog(); return document.querySelector(`.svc[data-c="${state.catalog.length - 1}"] .svc-name`)?.focus(); }
  if (d.catRm) { const c = state.catalog[+d.catRm]; if (confirm(`Remover "${c.name || 'serviço sem nome'}" do catálogo?`)) { state.catalog.splice(+d.catRm, 1); save(); renderCatalog(); } return; }
  if ('varAdd' in d || d.varRm) {
    const i = +t.closest('.svc').dataset.c, c = state.catalog[i];
    if (d.varRm) c.vars.splice(+d.varRm, 1); else (c.vars ??= []).push({label: '', price: 0});
    save(); renderCatalog();
    if (!d.varRm) document.querySelector(`.svc[data-c="${i}"] .var:last-child input`)?.focus();
    return;
  }

  const q = view === 'edit' && findQ(editId);
  if (q && d.it) {
    const i = +t.closest('.item').dataset.i;
    if (d.it === 'rm') q.items.splice(i, 1);
    if (d.it === 'up' && i > 0) q.items.splice(i - 1, 0, q.items.splice(i, 1)[0]);
    if (d.it === 'down' && i < q.items.length - 1) q.items.splice(i + 1, 0, q.items.splice(i, 1)[0]);
    save(); $('#items').innerHTML = itemsHTML(q); return refreshPreview(q);
  }
  switch (d.act) {
    case 'back': return go('list');
    case 'pdf': return printQuote(q);
    case 'dup': { const n = newQuote(q); toast(`Duplicado como ${n.number}`); return go('edit', n.id); }
    case 'del': if (confirm(`Excluir o orçamento ${q.number}?`)) { state.quotes = state.quotes.filter(x => x !== q); save(); go('list'); } return;
    case 'addFree': q.items.push({name: '', desc: '', qty: 1, unit: 'un', price: 0}); save(); $('#items').innerHTML = itemsHTML(q); refreshPreview(q); return $('#items .item:last-child input')?.focus();
    case 'logo': return pickFile('image/png,image/svg+xml,image/jpeg,image/webp', data => { state.settings.brand.logo = data; save(); render(); });
    case 'logoRm': state.settings.brand.logo = ''; save(); return render();
    case 'logoL': return pickFile('image/png,image/svg+xml,image/jpeg,image/webp', data => { state.settings.brand.logoLight = data; save(); render(); });
    case 'logoLRm': state.settings.brand.logoLight = ''; save(); return render();
    case 'font': return pickFile('.ttf,.otf,.woff,.woff2', (data, file) => { Object.assign(state.settings.brand, {fontData: data, fontLabel: file.name}); save(); render(); });
    case 'fontRm': Object.assign(state.settings.brand, {fontData: '', fontLabel: ''}); save(); return render();
    case 'logout': return logout();
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], {type: 'application/json'}));
      a.download = `orcamentos-backup-${today()}.json`; a.click(); return toast('Backup exportado');
    }
    case 'import': return pickFile('application/json,.json', txt => {
      try { const s = JSON.parse(txt); if (!s.settings || !s.quotes) throw 0;
        if (!confirm(`Substituir os dados atuais por este backup (${s.quotes.length} orçamentos)?`)) return;
        state = hydrate(s); save(); toast('Backup importado'); render();
      } catch (err) { toast('Arquivo de backup inválido'); }
    });
  }
});

document.addEventListener('dblclick', e => { const r = e.target.closest('[data-sel]'); if (r) go('edit', r.dataset.sel); });

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'addCat' && t.value) {
    const q = findQ(editId), [cid, vi] = t.value.split('|'), c = state.catalog.find(x => x.id === cid);
    q.items.push(itemFrom(c, vi === '' ? null : +vi));
    save(); $('#items').innerHTML = itemsHTML(q); refreshPreview(q); t.value = '';
  }
  if (t.matches('[data-var]')) { // troca a variação de um item já adicionado
    const q = findQ(editId), it = q.items[+t.closest('.item').dataset.i], c = state.catalog.find(x => x.id === it.cid);
    const n = itemFrom(c, +t.value);
    Object.assign(it, {name: n.name, price: n.price, vi: n.vi});
    save(); $('#items').innerHTML = itemsHTML(q); refreshPreview(q);
  }
  if (t.matches('[data-num]')) { // reformata o número ao sair do campo
    const v = num(t.value); t.value = t.dataset.f === 'price' || t.dataset.vf === 'price' ? fnum(v, 2) : fnum(v);
  }
  if (t.matches('[data-s]')) onSetting(t);
});

// preenche os dados ao escolher um cliente já atendido
function fillKnownClient(q, name) {
  const c = knownClients(q.id).find(c => c.name.trim().toLowerCase() === name.trim().toLowerCase());
  if (!c) return;
  const keys = CLIENT_FIELDS.map(([k]) => k);
  if (keys.some(k => q.client[k])) return; // não sobrescreve o que já foi digitado
  keys.forEach(k => { q.client[k] = c[k] || ''; const el = document.querySelector(`[data-k="client.${k}"]`); if (el) el.value = q.client[k]; });
  if (c.contact && !keys.some(k => c[k])) q.client.address = c.contact;
  toast(`Dados de ${c.name} preenchidos`);
}

document.addEventListener('input', e => {
  const t = e.target, val = t.matches('[data-num]') ? num(t.value) : t.value;
  if (view === 'edit') {
    const q = findQ(editId); if (!q) return;
    if (t.dataset.k) {
      setPath(q, t.dataset.k, t.dataset.k === 'validity' ? num(t.value) : val);
      if (t.dataset.k === 'client.name') fillKnownClient(q, val);
    } else if (t.dataset.f && t.closest('.item')) {
      const box = t.closest('.item'), it = q.items[+box.dataset.i];
      it[t.dataset.f] = val;
      box.querySelector('.item-total').textContent = brl(num(it.qty) * num(it.price));
      box.querySelector('.warn').hidden = num(it.price) > 0;
    } else return;
    save(); refreshPreview(q);
  } else if (view === 'catalog' && t.closest('.svc')) {
    const c = state.catalog[+t.closest('.svc').dataset.c];
    if (t.dataset.vf) c.vars[+t.closest('.var').dataset.v][t.dataset.vf] = val;
    else if (t.dataset.f) c[t.dataset.f] = t.type === 'checkbox' ? t.checked : val;
    save();
  } else if (view === 'brand' && t.dataset.s && t.type !== 'checkbox' && t.tagName !== 'SELECT') onSetting(t);
});

function onSetting(t) {
  const k = t.dataset.s;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (k === 'nextNumber' || k === 'defaults.validity') v = Math.max(0, Math.round(num(v)));
  if (/^brand\.(primary|accent|light)$/.test(k) && !/^#[\da-f]{6}$/i.test(v)) return; // espera o HEX completo
  setPath(state.settings, k, v);
  document.querySelectorAll(`[data-s="${k}"]`).forEach(o => { if (o !== t && o.type !== 'checkbox') o.value = v; });
  save(); applyBrand(); renderTop(); brandPreview();
}

// ---------- login ----------
function showLogin() { $('#login').hidden = false; $('.app').style.display = 'none'; $('#loginLogo').src = LOGO_LIGHT; }
function showApp() { $('#login').hidden = true; $('.app').style.display = ''; }
async function startSession() {
  const cache = readCache();
  if (cache) { state = hydrate(cache.state); dirty = cache.dirty; }
  showApp(); render(); setSync(dirty ? 'saving' : 'ok');
  try {
    if (dirty) { synced = {settings: null, quotes: new Map()}; await push(); } // envia o que ficou pendente sem internet
    if (!dirty && !(await pull())) await push(); // conta nova: cria os dados na nuvem
    render();
  } catch (e) { console.error(e); setSync('offline'); }
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true; $('#loginErr').textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email: $('#email').value.trim(), password: $('#pass').value});
  btn.disabled = false;
  if (error) { $('#loginErr').textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar. Confira a internet.'; return; }
  user = data.user; $('#pass').value = ''; startSession();
};
async function logout() {
  if (demo) { location.href = location.pathname; return; }
  if (dirty) { await push(); if (dirty && !confirm('Há alterações que ainda não chegaram na nuvem. Sair mesmo assim?')) return; }
  await sb.auth.signOut(); localStorage.removeItem(KEY); location.reload();
}
// ao voltar para o app, busca o que foi feito no outro aparelho
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !user || demo || dirty || pushing) return;
  if (document.activeElement?.matches('input,textarea,select')) return;
  try { if (await pull()) render(); } catch (e) { setSync('offline'); }
});

applyBrand();
(async () => {
  if (location.hash === '#demo') startDemo();
  else {
    const {data: {session}} = await sb.auth.getSession();
    if (session) { user = session.user; startSession(); } else showLogin();
  }
  loadFonts().then(() => { if (user) render(); });
})();
</script>
